<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">CQAMS use-case diagram</title>
  <desc id="description">Patient, administrator, doctor, and public visitor interactions with CQAMS.</desc>
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #102a43; }
      .boundary { fill: #ffffff; stroke: #829ab1; stroke-width: 2; rx: 18; }
      .boundary-label { font: 700 16px Arial, sans-serif; fill: #334e68; }
      .actor-line { stroke: #526579; stroke-width: 2; }
      .actor-text { font: 14px Arial, sans-serif; fill: #102a43; text-anchor: middle; }
      .usecase { fill: #eaf3fa; stroke: #4a789b; stroke-width: 2; }
      .usecase-text { font: 13px Arial, sans-serif; fill: #102a43; text-anchor: middle; }
      .link { fill: none; stroke: #91a8bd; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1400" height="900" fill="#f5f8fb"/>
  <text x="40" y="48" class="title">CQAMS Use-Case Diagram</text>
  <rect x="240" y="130" width="920" height="700" class="boundary"/>
  <text x="265" y="160" class="boundary-label">Clinic Queue and Appointment Management System</text>

  <g class="link">
    <path d="M140 420 L280 210"/>
    <path d="M140 420 L280 315"/>
    <path d="M140 420 H280"/>
    <path d="M140 420 L280 525"/>
    <path d="M140 420 L280 630"/>
    <path d="M700 92 L610 180"/>
    <path d="M610 180 V630"/>
    <path d="M610 210 H630"/>
    <path d="M610 315 H630"/>
    <path d="M610 420 H630"/>
    <path d="M610 525 H630"/>
    <path d="M610 630 H630"/>
    <path d="M1260 350 L1130 340"/>
    <path d="M1260 350 L1130 470"/>
    <path d="M1260 660 H1130"/>
  </g>

  <g>
    <ellipse cx="400" cy="210" rx="120" ry="36" class="usecase"/>
    <text x="400" y="215" class="usecase-text">Register / sign in</text>
    <ellipse cx="400" cy="315" rx="120" ry="36" class="usecase"/>
    <text x="400" y="320" class="usecase-text">Request appointment</text>
    <ellipse cx="400" cy="420" rx="120" ry="36" class="usecase"/>
    <text x="400" y="425" class="usecase-text">View / cancel appointment</text>
    <ellipse cx="400" cy="525" rx="120" ry="36" class="usecase"/>
    <text x="400" y="530" class="usecase-text">View own queue status</text>
    <ellipse cx="400" cy="630" rx="120" ry="36" class="usecase"/>
    <text x="400" y="635" class="usecase-text">View medical history</text>

    <ellipse cx="760" cy="210" rx="130" ry="36" class="usecase"/>
    <text x="760" y="215" class="usecase-text">Approve patient accounts</text>
    <ellipse cx="760" cy="315" rx="130" ry="36" class="usecase"/>
    <text x="760" y="320" class="usecase-text">Review appointment requests</text>
    <ellipse cx="760" cy="420" rx="130" ry="36" class="usecase"/>
    <text x="760" y="425" class="usecase-text">Manage staff, doctors, schedules</text>
    <ellipse cx="760" cy="525" rx="130" ry="36" class="usecase"/>
    <text x="760" y="530" class="usecase-text">Manage clinics and appointments</text>
    <ellipse cx="760" cy="630" rx="130" ry="36" class="usecase"/>
    <text x="760" y="635" class="usecase-text">Check in, operate queue, report</text>

    <ellipse cx="1030" cy="340" rx="100" ry="36" class="usecase"/>
    <text x="1030" y="345" class="usecase-text">View assigned queue</text>
    <ellipse cx="1030" cy="470" rx="100" ry="36" class="usecase"/>
    <text x="1030" y="475" class="usecase-text">Complete consultation</text>
    <ellipse cx="1030" cy="660" rx="100" ry="36" class="usecase"/>
    <text x="1030" y="665" class="usecase-text">View public queue</text>
  </g>

  <g transform="translate(110 380)">
    <circle cx="20" cy="0" r="13" fill="#ffffff" stroke="#334e68" stroke-width="2"/>
    <path d="M20 13 V55 M0 30 H40 M20 55 L2 82 M20 55 L38 82" class="actor-line" fill="none"/>
    <text x="20" y="105" class="actor-text">Patient</text>
  </g>
  <g transform="translate(680 10)">
    <circle cx="20" cy="0" r="13" fill="#ffffff" stroke="#334e68" stroke-width="2"/>
    <path d="M20 13 V55 M0 30 H40 M20 55 L2 82 M20 55 L38 82" class="actor-line" fill="none"/>
    <text x="20" y="105" class="actor-text">Administrator</text>
  </g>
  <g transform="translate(1250 310)">
    <circle cx="20" cy="0" r="13" fill="#ffffff" stroke="#334e68" stroke-width="2"/>
    <path d="M20 13 V55 M0 30 H40 M20 55 L2 82 M20 55 L38 82" class="actor-line" fill="none"/>
    <text x="20" y="105" class="actor-text">Doctor</text>
  </g>
  <g transform="translate(1250 620)">
    <circle cx="20" cy="0" r="13" fill="#ffffff" stroke="#334e68" stroke-width="2"/>
    <path d="M20 13 V55 M0 30 H40 M20 55 L2 82 M20 55 L38 82" class="actor-line" fill="none"/>
    <text x="20" y="105" class="actor-text">Public visitor</text>
  </g>
</svg>
